# 本機開發環境（WSL2 + NVIDIA 顯卡）：Postgres + pgvector、TEI 嵌入、TEI 重排序跑在 GPU。
# footnote 本身直接在主機上跑。沒有 GPU 的環境改用 compose.cpu.yaml。
#
# WSL 不需要裝 NVIDIA container toolkit：把 /dev/dxg 與 /usr/lib/wsl（驅動的 libcuda）掛進容器即可。
# 映像用 turing 版（RTX 20 系列）；30 系列以上改用 89-/86- 開頭的 tag。
# port 刻意避開常見服務的預設值（5432、18080…）。
name: footnote

x-tei-gpu: &tei-gpu
  image: ghcr.io/huggingface/text-embeddings-inference:turing-1.8
  devices: ["/dev/dxg:/dev/dxg"]
  environment:
    LD_LIBRARY_PATH: /usr/lib/wsl/lib
  volumes:
    - /usr/lib/wsl:/usr/lib/wsl:ro
    - tei-cache:/data
  restart: unless-stopped

services:
  db:
    image: docker.io/pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: footnote
      POSTGRES_PASSWORD: footnote
      POSTGRES_DB: footnote
    ports: ["127.0.0.1:25432:5432"]
    volumes: [db-data-18:/var/lib/postgresql]  # 18 起資料放在大版本專屬子目錄，掛載點要改；舊的 db-data 是 16 的資料
    restart: unless-stopped

  # 預設的 16384 batch tokens 在預熱時會吃光顯卡記憶體；片段最長約 1200 字，4096 足夠
  # --tokenization-workers 預設等於 CPU 核數（16），每個工作者各複製一份 25 萬詞的分詞器，
  # 一個容器光這樣就佔 ~3GB 主記憶體。2026-11-05 實測（reranker）：16→2 個，RSS 3.9GB→1.0GB，
  # 30 段重排序中位數 375ms→392ms、4 路併發總時間 1856ms→1823ms（瓶頸在 GPU，不在分詞）。
  tei-embed:
    <<: *tei-gpu
    command: ["--model-id", "BAAI/bge-m3", "--port", "80", "--max-batch-tokens", "4096", "--auto-truncate", "--tokenization-workers", "2"]
    ports: ["127.0.0.1:28080:80"]

  tei-rerank:
    <<: *tei-gpu
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "80", "--max-batch-tokens", "4096", "--auto-truncate", "--tokenization-workers", "2"]
    ports: ["127.0.0.1:28081:80"]

volumes:
  db-data-18:
  tei-cache:
